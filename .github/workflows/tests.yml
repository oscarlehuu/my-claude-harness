name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Run the maestro test suite
        run: bash tests/run-all.sh
